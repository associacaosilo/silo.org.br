<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Gerenciador de Conteúdo</title>
  </head>
  <body>
    <script>CMS_MANUAL_INIT = true</script>
    <!-- Include Decap CMS and the locales package -->
    <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/decap-cms-locales@3.9.0/dist/decap-cms-locales.js"></script>

    <script type="module">
      import pt from "https://unpkg.com/decap-cms-locales@3.9.0/dist/esm/pt/index.js";
      const { CMS } = window

      CMS.registerLocale("pt", pt);

      // Em localhost, o login usa o Worker local (cd cms-auth && npx wrangler dev).
      const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
      CMS.init(isLocal ? { config: { backend: { base_url: "http://localhost:8787" } } } : {});
    </script>
  </body>
</html>
