name = "silo-cms-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Endereço público do Worker. Exige a zona silo.org.br nesta conta Cloudflare.
routes = [{ pattern = "auth.silo.org.br", custom_domain = true }]

[vars]
# Origens que podem receber o token. Ajuste o nome do projeto Pages se for outro.
ALLOWED_ORIGINS = "https://silo.org.br,https://silo-org-br.pages.dev,https://*.silo-org-br.pages.dev,http://localhost:4666,http://127.0.0.1:4666"
